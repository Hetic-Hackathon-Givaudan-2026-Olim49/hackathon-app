name: hackathon

services:
  dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: npm run dev
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - .:/workspace:cached
    ports:
      - '3000:3000'
      - '5173:5173'
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - ./db/data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 5s
      timeout: 3s
      retries: 10
